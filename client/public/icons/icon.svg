<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />

  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- Center Icon: School Cap + Camera/AI Reticle + Checkmark -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Scanning / Face Reticle Corners -->
    <path d="M 40 100 L 40 40 L 100 40" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 284 40 L 344 40 L 344 100" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 40 284 L 40 344 L 100 344" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 284 344 L 344 344 L 344 284" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- School Graduation Cap / Book Shape -->
    <path d="M 192 110 L 80 170 L 192 230 L 304 170 Z" fill="#ffffff" />
    <path d="M 130 200 L 130 250 C 130 285 254 285 254 250 L 254 200" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <line x1="290" y1="180" x2="290" y2="260" stroke="#fef08a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="290" cy="270" r="10" fill="#fef08a"/>

    <!-- Attendance Verified Badge -->
    <circle cx="192" cy="240" r="48" fill="#10b981" stroke="#ffffff" stroke-width="10"/>
    <path d="M 174 240 L 186 252 L 210 226" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
