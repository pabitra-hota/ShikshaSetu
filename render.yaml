services:
  - type: web
    name: shikshasetu
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node start.js
    envVars:
      - key: DATABASE_URL
        value: file:./data/prod.db
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: "ShikshaSetu - AI Rural School Attendance PWA"
      - key: NEXT_PUBLIC_APP_VERSION
        value: "1.0.0"
      - key: NODE_VERSION
        value: "20"
